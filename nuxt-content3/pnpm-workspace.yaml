allowBuilds:
  'unrs-resolver': true
  '@parcel/watcher': false
  'esbuild': false
  'better-sqlite3': true

# security overrides 
# currently necessary because @nuxt/content depends on vulnerable zod version
overrides:
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  zod@<4.6.6: ^4.6.6
